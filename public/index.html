<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LegoSearch</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      if (window.location.protocol === "file:") {
        window.location.replace("http://localhost:5178/");
      }
    </script>
  </head>
  <body>
    <main class="workspace">
      <section class="query-strip">
        <div>
          <p class="kicker">&#x53f0;&#x7063;&#x96fb;&#x5546;&#x50f9;&#x683c;&#x641c;&#x5c0b;</p>
          <h1>LegoSearch</h1>
        </div>

        <form id="search-form" class="search-form">
          <label class="field">
            <span>&#x95dc;&#x9375;&#x5b57;&#x6216;&#x578b;&#x865f;</span>
            <input id="query" type="search" value="10305" autocomplete="off" />
          </label>

          <div id="platforms" class="platform-grid"></div>

          <button type="submit">&#x641c;&#x5c0b;&#x50f9;&#x683c;</button>
        </form>
      </section>

      <section class="summary-bar">
        <div>
          <strong id="summary-title">&#x5c31;&#x7dd2;</strong>
          <span id="summary-detail">&#x9078;&#x64c7;&#x5e73;&#x53f0;&#xff0c;&#x8f38;&#x5165;&#x6a02;&#x9ad8;&#x95dc;&#x9375;&#x5b57;&#x958b;&#x59cb;&#x6bd4;&#x50f9;&#x3002;</span>
        </div>
        <div class="result-controls">
          <label class="field compact">
            <span>&#x6392;&#x5e8f;</span>
            <select id="sort">
              <option value="price-asc">&#x50f9;&#x683c;&#x4f4e;&#x5230;&#x9ad8;</option>
              <option value="price-desc">&#x50f9;&#x683c;&#x9ad8;&#x5230;&#x4f4e;</option>
              <option value="platform">&#x5e73;&#x53f0;</option>
            </select>
          </label>
          <label class="field compact">
            <span>&#x6700;&#x4f4e;&#x50f9;&#x7be9;&#x9078;</span>
            <select id="discount-floor">
              <option value="0">&#x4e0d;&#x7be9;&#x9078;</option>
              <option value="0.2">2 &#x6298;</option>
              <option value="0.3" selected>3 &#x6298;</option>
              <option value="0.4">4 &#x6298;</option>
              <option value="0.5">5 &#x6298;</option>
              <option value="0.6">6 &#x6298;</option>
              <option value="0.7">7 &#x6298;</option>
              <option value="0.8">8 &#x6298;</option>
              <option value="0.9">9 &#x6298;</option>
            </select>
          </label>
          <label class="thumbnail-toggle">
            <input id="show-thumbnails" type="checkbox" />
            <span>&#x986f;&#x793a;&#x7e2e;&#x5716;</span>
          </label>
          <button id="verify-iopen" class="secondary-button" type="button">&#x9a57;&#x8b49; iOPEN Mall</button>
        </div>
      </section>

      <section id="official-prices" class="official-prices" hidden></section>
      <section id="alerts" class="alerts" hidden></section>
      <p id="open-instructions" class="startup-notice" hidden></p>
      <section id="lowest-results" class="lowest-results" hidden></section>
      <section id="results" class="results"></section>
    </main>

    <template id="result-card-template">
      <article class="result-card">
        <div class="media">
          <img alt="" loading="lazy" />
          <span>LEGO</span>
        </div>
        <div class="content">
          <div class="meta">
            <span class="platform"></span>
            <span class="source"></span>
          </div>
          <h3></h3>
          <p class="notice"></p>
          <strong class="price"></strong>
          <div class="footer">
            <time></time>
            <a target="_blank" rel="noreferrer">Open</a>
          </div>
        </div>
      </article>
    </template>

    <template id="platform-group-template">
      <section class="platform-group">
        <header class="platform-heading">
          <div class="platform-heading-info">
            <h2></h2>
            <span class="platform-count"></span>
          </div>
          <button class="group-toggle" type="button"></button>
        </header>
        <div class="platform-results" hidden></div>
      </section>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
